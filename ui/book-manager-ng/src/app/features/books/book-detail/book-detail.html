<div class="detail-container">
  <div class="breadcrumb">
    <a routerLink="/dashboard">控制台</a> / 
    <a routerLink="/books">图书列表</a> / 详情
  </div>

  @if (loading()) {
    <div class="loading-spinner">正在加载图书详情...</div>
  } @else {
    @if (book(); as b) {
      <div class="book-card">
        <div class="book-header">
          <h2>{{ b.title }}</h2>
          <span class="badge">{{ b.category }}</span>
        </div>
        
        <div class="book-info">
          <p><strong>作者：</strong> {{ b.author }}</p>
          <p><strong>图书编号：</strong> {{ b.id }}</p>
          <p class="price"><strong>定价：</strong> {{ b.price | currency:'CNY' }}</p>
        </div>

        <div class="book-description">
          <h3>简介</h3>
          <p>这是关于 《{{ b.title }}》 的详细描述内容。</p>
        </div>

        <div class="actions">
          <button class="btn-edit">编辑图书</button>
          <button routerLink="/books" class="btn-back">返回列表</button>
        </div>
      </div>
    } @else {
      <div class="error-state">
        <p>未找到该图书，请检查 ID 是否正确。</p>
        <button routerLink="/books">返回列表</button>
      </div>
    }
  }
</div>
