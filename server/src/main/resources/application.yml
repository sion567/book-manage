spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:sample;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
application:
  security:
    jwt:
      issuer: my-system
      audience: my-client
      expiration: 86400
      refresh-token:
        expiration: 604800
